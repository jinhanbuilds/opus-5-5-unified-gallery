<!doctype html>

<style>

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="tl" class="pn"><div class="k">ONE CONTINUOUS PUSH-IN</div><div class="t">ROOM → QUARKS</div></div>
  <div id="bl" class="pn"><div id="lv">ROOM</div><div id="cn">房间</div><div id="sz">≈ 5 m</div><div id="note">~5 m across</div></div>
  <div id="ru" class="pn"><div class="ax"></div><div id="mk"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
/* Room → quarks, 16 s, 16:9, three.js r134. Seven small scenes, one push-in:
   each level's camera distance falls exponentially (constant zoom speed); at every hand-off the next level is
   rendered to a render target and revealed as a circle growing from frame centre (0.7 s), so it reads as one shot.
   0.0 room(~5 m) → 2.2 laptop(~30 cm, top case turns x-ray) → 4.4 processor die(~1 cm) → 6.6 silicon lattice(0.54 nm cell)
   → 8.8 Si atom(~0.2 nm, nucleus enlarged) → 11.0 Si-28 nucleus(~7 fm) → 13.2 proton(~1.7 fm, uud + gluon flux tubes)
   15.4–16.0 flat cross-fade back to the room at its first frame → seamless loop.
   Scale readout = true view width (camera distance × fov × metres-per-unit of that level); log-interpolated across hand-offs.
*/
(() => {
const DUR = 16, SEG = 2.2, OV = .35;
const canvas = document.getElementById('c'), hud = document.getElementById('hud');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const P = (t, a, b) => cl((t - a) / (b - a));
const EIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const L = (a, b, k) => a + (b - a) * k;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FOV = 40, ASP = 16 / 9, VW = d => 2 * d * Math.tan(FOV * Math.PI / 360) * ASP;

// ---------- small builders ----------
const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .8, metalness: 0 }, o));
function box(g, w, h, d, m, x, y, z) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof m === 'string' ? mat(m) : m); b.position.set(x, y, z); g.add(b); return b; }
function cyl(g, r1, r2, h, m, x, y, z, seg = 20) { const b = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), typeof m === 'string' ? mat(m) : m); b.position.set(x, y, z); g.add(b); return b; }
function sph(g, r, m, x, y, z, seg = 24) { const b = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg * .6 | 0)), typeof m === 'string' ? mat(m) : m); b.position.set(x, y, z); g.add(b); return b; }
function cvs(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
function lights(s, sky, ground, hi, dirCol, di, dpos) {
  s.add(new THREE.HemisphereLight(sky, ground, hi));
  const d = new THREE.DirectionalLight(dirCol, di); d.position.copy(dpos); s.add(d); return d;
}
function makeLevel(bg) { const scene = new THREE.Scene(); scene.background = new THREE.Color(bg); const cam = new THREE.PerspectiveCamera(FOV, ASP, .01, 100); return { scene, cam }; }
function place(cam, target, dir, dist) { cam.position.copy(target).addScaledVector(dir, dist); cam.lookAt(target); cam.near = dist * .02; cam.far = dist * 80 + 30; cam.updateProjectionMatrix(); }
const vlerp = (a, b, k) => a.clone().lerp(b, k);
const dlerp = (a, b, k) => a.clone().lerp(b, k).normalize();

// shared textures
const screenTex = cvs(512, 320, (x, w, h) => {
  x.fillStyle = '#16191F'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#1F242C'; x.fillRect(0, 0, 110, h); x.fillRect(0, 0, w, 26);
  ['#E06C5A', '#E9B45A', '#6BBF8A'].forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.arc(14 + i * 16, 13, 5, 0, 7); x.fill(); });
  const R = rng(11), cols = ['#7FB4E8', '#E9B45A', '#9FD3A9', '#D98C7A', '#C9C3B8'];
  for (let i = 0; i < 9; i++) { x.fillStyle = '#39414D'; x.fillRect(14, 44 + i * 26, 60 + R() * 30, 9); }
  for (let i = 0; i < 17; i++) { let px = 130 + (i % 5 === 0 ? 0 : 20 + (i % 3) * 16); for (let k = 0; k < 3; k++) { const ww = 20 + R() * 90; x.fillStyle = cols[(R() * cols.length) | 0]; x.fillRect(px, 40 + i * 16, ww, 7); px += ww + 8; if (px > 470) break; } }
  x.strokeStyle = '#E9B45A'; x.lineWidth = 3; x.beginPath(); for (let i = 0; i <= 10; i++) x.lineTo(360 + i * 13, 280 - Math.sin(i * .9) * 14 - i * 3); x.stroke();
});
const dotTex = cvs(64, 64, (x) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });

// point cloud shader (flicker by time; deterministic)
function pointsMat(size, opacity) {
  return new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, size: { value: size }, scale: { value: 500 }, op: { value: opacity } },
    vertexShader: 'attribute vec3 color; attribute float phase; uniform float time, size, scale; varying vec3 vC; varying float vA;' +
      'void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * mv; vC = color;' +
      'vA = 0.55 + 0.45 * sin(time * (2.0 + fract(phase * 7.0) * 3.0) + phase * 6.2831); gl_PointSize = min(size * scale / -mv.z, 48.0); }',
    fragmentShader: 'uniform float op; varying vec3 vC; varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard; float a = pow(1.0 - d * 2.0, 1.6) * vA * op; gl_FragColor = vec4(vC * a, a); }',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
}
function cloud(pos, cols, mat) {
  const g = new THREE.BufferGeometry(), R = rng(pos.length);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setAttribute('phase', new THREE.Float32BufferAttribute(Array.from({ length: pos.length / 3 }, () => R()), 1));
  return new THREE.Points(g, mat);
}

// ======================= LEVEL 0 : ROOM (1 unit = 1 m) =======================
function levelRoom() {
  const lv = makeLevel('#2A2521'), s = lv.scene; lv.m = 1;
  lights(s, 0xFFF3E0, 0x5A4636, .8, 0xFFE2B8, .55, V(2, 3, -3));
  const fill = new THREE.DirectionalLight(0xFFF1DE, .55); fill.position.set(-2, 2.5, 4); s.add(fill);
  const lamp = new THREE.PointLight(0xFFC27A, .9, 3.2); lamp.position.set(-.22, 1.18, -2.25); s.add(lamp);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), mat('#7B5A42')); floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 0.5); s.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), mat('#E8E2D8')); ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 2.8, .5); s.add(ceil);
  box(s, 6, 2.8, .05, '#D8CFC0', 0, 1.4, -2.5);
  const lw = box(s, .05, 2.8, 6, '#CFC6B6', -3, 1.4, .5), rw = box(s, .05, 2.8, 6, '#D3CABB', 3, 1.4, .5);
  box(s, 6, .1, .03, '#EFE9DE', 0, .05, -2.47);
  // window with sky gradient
  const skyT = cvs(128, 128, (x) => { const g = x.createLinearGradient(0, 0, 0, 128); g.addColorStop(0, '#BFD8EA'); g.addColorStop(.7, '#F4E7CF'); g.addColorStop(1, '#E8D2A8'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); x.fillStyle = '#9DB39A'; for (let i = 0; i < 9; i++) { x.beginPath(); x.arc(i * 16, 118, 14 + (i % 3) * 5, 0, 7); x.fill(); } });
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 1.1), new THREE.MeshBasicMaterial({ map: skyT })); glass.position.set(1.35, 1.6, -2.47); s.add(glass);
  const wf = '#F2EEE6';
  box(s, 1.42, .06, .06, wf, 1.35, 2.18, -2.46); box(s, 1.42, .06, .06, wf, 1.35, 1.02, -2.46); box(s, .06, 1.2, .06, wf, .64, 1.6, -2.46); box(s, .06, 1.2, .06, wf, 2.06, 1.6, -2.46);
  box(s, .03, 1.1, .03, wf, 1.35, 1.6, -2.45); box(s, 1.3, .03, .03, wf, 1.35, 1.6, -2.45); box(s, 1.6, .04, .16, wf, 1.35, 1.0, -2.4);
  // framed print
  const art = cvs(160, 120, (x) => { x.fillStyle = '#EFE7D8'; x.fillRect(0, 0, 160, 120); x.fillStyle = '#C8553D'; x.beginPath(); x.arc(58, 60, 30, 0, 7); x.fill(); x.fillStyle = '#2F5F98'; x.fillRect(84, 26, 44, 68); x.fillStyle = '#E0AE3C'; x.fillRect(30, 96, 100, 6); });
  box(s, .78, .58, .03, '#2B2724', -1.25, 1.65, -2.48);
  const artM = new THREE.Mesh(new THREE.PlaneGeometry(.7, .5), new THREE.MeshBasicMaterial({ map: art })); artM.position.set(-1.25, 1.65, -2.46); s.add(artM);
  // rug
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.7), mat('#8A4F3A')); rug.rotation.x = -Math.PI / 2; rug.position.set(.2, .004, -1.1); s.add(rug);
  const rug2 = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.4), mat('#A8674C')); rug2.rotation.x = -Math.PI / 2; rug2.position.set(.2, .006, -1.1); s.add(rug2);
  // desk
  box(s, 1.5, .04, .72, '#9A7652', .3, .74, -2.1);
  [[-.4, -2.4], [1.0, -2.4], [-.4, -1.8], [1.0, -1.8]].forEach(([x, z]) => box(s, .04, .72, .04, '#2D2A27', x, .36, z));
  box(s, .5, .16, .6, '#8C6A49', .72, .6, -2.1);
  // laptop
  const lap = new THREE.Group(); lap.position.set(.3, .76, -2.05); s.add(lap);
  const alu = mat('#B9BCC0', { metalness: .6, roughness: .35 });
  box(lap, .31, .012, .215, alu, 0, .006, 0); box(lap, .27, .002, .1, '#2A2C30', 0, .013, -.03); box(lap, .1, .002, .06, '#A6A9AE', 0, .013, .065);
  const lid = new THREE.Group(); lid.position.set(0, .012, -.1075); lid.rotation.x = -.3; lap.add(lid);
  box(lid, .31, .205, .006, alu, 0, .1025, 0);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(.29, .18), new THREE.MeshBasicMaterial({ map: screenTex })); scr.position.set(0, .104, .0035); lid.add(scr);
  // desk props
  cyl(s, .04, .035, .1, '#E6E0D4', .75, .81, -1.95); box(s, .22, .02, .3, '#2F4B6E', -.15, .77, -1.95);
  cyl(s, .08, .09, .02, '#2D2A27', -.22, .77, -2.3); cyl(s, .01, .01, .36, '#2D2A27', -.22, .95, -2.3);
  const shade = cyl(s, .02, .08, .1, '#C8553D', -.2, 1.15, -2.25); shade.rotation.x = .4;
  // chair
  const ch = '#3D4A52';
  box(s, .46, .05, .46, ch, .35, .46, -1.3); box(s, .46, .5, .04, ch, .35, .74, -1.08);
  [[.14, -1.51], [.56, -1.51], [.14, -1.09], [.56, -1.09]].forEach(([x, z]) => box(s, .03, .46, .03, '#23272B', x, .23, z));
  // bookshelf on the left wall
  const sh = new THREE.Group(); sh.position.set(-2.78, 0, -1.2); s.add(sh);
  const wood = '#6E4E36';
  box(sh, .36, 1.9, .03, wood, 0, .95, -.5); box(sh, .36, 1.9, .03, wood, 0, .95, .5);
  const R = rng(5), pal = ['#8C3B2E', '#2F4B6E', '#C9A24A', '#3F6B4F', '#D8CFC0', '#6A4A5A', '#B86A3C', '#1F2A30'];
  for (let k = 0; k < 5; k++) {
    const y = .05 + k * .45; box(sh, .36, .03, 1.0, wood, 0, y, 0);
    if (k === 4) break;
    let z = -.47; while (z < .44) { const w = .03 + R() * .04, h = .22 + R() * .12; if (R() < .12) { z += .06; continue; } box(sh, .24, h, w, pal[(R() * pal.length) | 0], .02, y + .015 + h / 2, z + w / 2); z += w + .004; }
  }
  // plant
  cyl(s, .16, .12, .32, '#B9643C', -1.9, .16, -2.1);
  const leaf = mat('#4E7A4A', { flatShading: true });
  for (let i = 0; i < 9; i++) { const a = i * 2.4, r = .08 + (i % 3) * .05, m = sph(s, .13 + (i % 2) * .05, leaf, -1.9 + Math.cos(a) * r, .45 + i * .06, -2.1 + Math.sin(a) * r, 6); m.scale.set(1, .55, 1); m.rotation.set(a, a * .5, 0); }
  const T0 = V(.3, .864, -2.188);
  const d0 = V(-1.7, 1.8, 1.1).sub(T0), dist0 = d0.length(); d0.normalize();
  const d1 = V(0, .2, 1).normalize();
  lv.update = (p) => { const dist = dist0 * Math.pow(.5 / dist0, p); place(lv.cam, T0, dlerp(d0, d1, EIO(p)), dist); return dist; };
  lv.info = ['ROOM', '房间', '~5 m across'];
  return lv;
}

// ======================= LEVEL 1 : LAPTOP (1 unit = 10 cm) =======================
function levelLaptop() {
  const lv = makeLevel('#3A3129'), s = lv.scene; lv.m = .1;
  lights(s, 0xFFF3E0, 0x4A3A2C, .85, 0xFFFFFF, .8, V(-3, 6, 4));
  const desk = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), mat('#9A7652')); desk.rotation.x = -Math.PI / 2; s.add(desk);
  const alu = mat('#B7BBC0', { metalness: .6, roughness: .38 });
  box(s, 3.1, .1, 2.15, alu, 0, .05, 0);
  // internals (revealed when the top case turns transparent)
  box(s, 2.9, .01, 2.0, '#1B1D21', 0, .102, 0);
  box(s, 2.3, .02, .95, '#1F5A3F', 0, .115, -.5);
  [[-.9, .45], [-.3, .45], [.3, .45], [.9, .45]].forEach(([x, z]) => box(s, .5, .03, .7, '#3C4046', x, .12, z));
  box(s, .34, .02, .34, '#2D3B33', 0, .135, -.42); box(s, .19, .012, .19, '#3A4048', 0, .15, -.42);
  [[-.35, -.6], [-.35, -.3], [.35, -.6], [.35, -.3]].forEach(([x, z]) => box(s, .16, .02, .1, '#111317', x, .132, z));
  const R = rng(9); for (let i = 0; i < 26; i++) box(s, .03 + R() * .05, .02, .02 + R() * .04, R() < .5 ? '#C9B27A' : '#2A2C30', (R() - .5) * 2.1, .13, -.5 + (R() - .5) * .85);
  [-1.2, 1.2].forEach(x => cyl(s, .22, .22, .03, '#2A2C30', x, .125, -.55));
  // top case + keys (fade to x-ray)
  const topM = mat('#B7BBC0', { metalness: .6, roughness: .38, transparent: true });
  const top = box(s, 3.08, .02, 2.12, topM, 0, .17, 0);
  const keyM = mat('#1F2124', { transparent: true });
  const keys = new THREE.InstancedMesh(new THREE.BoxGeometry(.19, .03, .17), keyM, 70), o = new THREE.Object3D();
  let n = 0; for (let r = 0; r < 5; r++) for (let c = 0; c < 13; c++) { o.position.set(-1.28 + c * .213, .19, -.9 + r * .2); o.updateMatrix(); keys.setMatrixAt(n++, o.matrix); }
  o.position.set(0, .19, .1); o.scale.set(6, 1, 1); o.updateMatrix(); keys.setMatrixAt(n++, o.matrix); keys.count = n; s.add(keys);
  const padM = mat('#A9ADB2', { metalness: .5, roughness: .4, transparent: true }); box(s, 1.1, .006, .66, padM, 0, .182, .62);
  // lid + screen
  const lid = new THREE.Group(); lid.position.set(0, .18, -1.075); lid.rotation.x = -.3; s.add(lid);
  box(lid, 3.1, 2.05, .06, alu, 0, 1.025, 0);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 1.8), new THREE.MeshBasicMaterial({ map: screenTex })); scr.position.set(0, 1.04, .032); lid.add(scr);
  const Ta = V(0, .18 + 1.04 * Math.cos(.3), -1.075 - 1.04 * Math.sin(.3)), Tb = V(0, .15, -.42);
  const da = V(0, .2, 1).normalize(), db = V(.06, 1, .32).normalize();
  lv.update = (p) => {
    const k = EIO(p), x = 1 - .93 * EIO(P(p, .38, .72));
    [topM, keyM, padM].forEach(m => { m.opacity = x; m.depthWrite = x > .98; });
    const dist = 5 * Math.pow(.45 / 5, p); place(lv.cam, vlerp(Ta, Tb, k), dlerp(da, db, k), dist); return dist;
  };
  lv.info = ['LAPTOP', '笔记本电脑', '~30 cm wide · top case shown as x-ray'];
  return lv;
}

// ======================= LEVEL 2 : PROCESSOR DIE (1 unit = 7.5 mm) =======================
function levelChip() {
  const lv = makeLevel('#101418'), s = lv.scene; lv.m = .0075;
  const key = lights(s, 0xDDE6F0, 0x1A2A22, .7, 0xFFFFFF, 1.0, V(3, 5, 2));
  const pcb = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), mat('#1B4A35', { roughness: .6 })); pcb.rotation.x = -Math.PI / 2; pcb.position.y = -.06; s.add(pcb);
  const R = rng(21); for (let i = 0; i < 40; i++) { const a = R() * 6.28, r = 2.2 + R() * 4; box(s, .1 + R() * .3, .06, .08 + R() * .2, R() < .6 ? '#15181C' : '#B39A5A', Math.cos(a) * r, -.03, Math.sin(a) * r); }
  box(s, 3, .08, 3, mat('#2A3A30', { roughness: .55 }), 0, 0, 0);
  const padG = new THREE.InstancedMesh(new THREE.BoxGeometry(.06, .01, .12), mat('#C9A95A', { metalness: .8, roughness: .3 }), 88), o = new THREE.Object3D();
  let n = 0; for (let side = 0; side < 4; side++) for (let i = 0; i < 22; i++) { const u = -1.3 + i * .124; o.position.set(side < 2 ? u : (side === 2 ? -1.42 : 1.42), .045, side < 2 ? (side ? 1.42 : -1.42) : u); o.rotation.y = side < 2 ? 0 : Math.PI / 2; o.updateMatrix(); padG.setMatrixAt(n++, o.matrix); }
  s.add(padG);
  box(s, 1.72, .03, 1.72, mat('#1E2228', { metalness: .4, roughness: .4 }), 0, .055, 0);
  const dieT = cvs(1024, 1024, (x, w, h) => {
    const R = rng(33); x.fillStyle = '#242A31'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#8A7A52'; for (let i = 0; i < 48; i++) { const u = 40 + i * 19.6; x.fillRect(u, 14, 10, 22); x.fillRect(u, h - 36, 10, 22); x.fillRect(14, u, 22, 10); x.fillRect(w - 36, u, 22, 10); }

// ======================= LEVEL 3 : SILICON LATTICE (1 unit = 0.543 nm) =======================

    const p = [i + b[0] + off, j + b[1] + off, k + b[2] + off]; if (p.some(v => v > 3.001)) continue;

// ======================= LEVEL 4 : SILICON ATOM (1 unit = 0.11 nm) =======================

}
[5, .3, .01, 5.43e-10, 2.2e-10, 7e-15, 1.7e-15].forEach(v => { const d = document.createElement('div'); d.className = 'dt'; d.style.top = ly(Math.log10(v)) + 'px'; ru.appendChild(d); });

// ---------- frame ----------
function frame(t) {
  let A = 0; for (let i = 0; i < 7; i++) if (t >= win(i)[0]) A = i;
  const loopK = P(t, 6 * SEG + 2 * 0 + (DUR - 6 * SEG - .6 - 0) + 0, DUR); // 15.4 → 16.0
  let B = -1, f = 0, flat = 0;
  if (t >= DUR - .6) { B = 0; f = P(t, DUR - .6, DUR); flat = 1; A = 6; }
  else if (A > 0 && t < A * SEG + OV) { B = A; A = A - 1; f = P(t, B * SEG - OV, B * SEG + OV); }
  renderer.setRenderTarget(null); renderer.autoClear = true;
  const mA = upd(A, t);
  renderer.render(LV[A].scene, LV[A].cam);
  let meters = mA, info = A;
  if (B >= 0) {

    renderer.setRenderTarget(rt); renderer.clear(); renderer.render(LV[B].scene, LV[B].cam); renderer.setRenderTarget(null);
    const e = EIO(f);

    renderer.autoClear = false; renderer.render(qScene, qCam); renderer.autoClear = true;

function loop(now) { if (!playing) return; cur = ((now - t0) / 1000) % DUR; frame(cur); raf = requestAnimationFrame(loop); }
window.DURATION = DUR;
window.seek = t => { cur = ((+t % DUR) + DUR) % DUR; t0 = performance.now() - cur * 1000; frame(cur); return document.fonts ? document.fonts.ready.then(() => frame(cur)) : undefined; };
window.__demo = {
  play() { if (playing) return; playing = true; t0 = performance.now() - cur * 1000; raf = requestAnimationFrame(loop); },
  pause() { playing = false; cancelAnimationFrame(raf); },
  get playing() { return playing; }, get time() { return cur; }
};
addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'demo:play') __demo.play(); else if (d.type === 'demo:pause') __demo.pause(); else if (d.type === 'demo:seek') seek(d.t || 0);
});
document.addEventListener('visibilitychange', () => {
  cancelAnimationFrame(raf);
  if (!document.hidden && playing) { t0 = performance.now() - cur * 1000; raf = requestAnimationFrame(loop); }
});
addEventListener('resize', resize);
resize();
raf = requestAnimationFrame(loop);
try { parent.postMessage({ type: 'demo:ready', id: 'v09-room-to-quarks', duration: DUR }, '*'); } catch (e) {}
})();
</script>
