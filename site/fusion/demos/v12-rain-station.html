<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rain Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{position:absolute;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* RAIN STATION — 24 s procedural storyboard short. Stage 1920×1080, picture 2.39:1 (1920×804, bars 138 px).
   One draw(t). 2.5D pinhole camera over depth layers (sky/city d=150, far platform d=14, train d=11, near floor d=5,
   her d=2, black umbrella d=1.7); per-layer defocus from circle-of-confusion |1/z − 1/focus|; circular bokeh;
   character poses stepped "on twos" (12 fps) while camera moves stay smooth.
   0.0– 5.1  S1  ECU drops on her transparent umbrella → dolly out to over-the-shoulder, rack focus to him
   5.1– 7.5  S2  MCU him under the streetlight (tele): head down → looks up toward frame left
   7.5– 9.9  S3  frontal CU her: blink → recognition (distant horn = warm glow creeping in)
   9.9–13.6  S4  long shot: headlights first, 5-car train with speed-ramp; gap 1 shows him, gap 2 is empty
  13.6–15.0  S5  CU teary eyes, window light bands sweep, hair blown by the train's wind
  15.0–17.9  S6  down-the-track view: tail lights recede, empty platform, streetlight flickers and dies
  17.9–22.9  S7  her back, focus pulls from empty platform to her; black umbrella covers her; she turns; subtitle
  22.9–24.0  S8  black title 雨站 / RAIN STATION; from 23.5 fades up into S1(t−24) → frame at 24 == frame at 0
*/
(() => {
const W = 1920, H = 1080, DUR = 24, PT = 138, PH = 804, HZ = 402;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sc = document.createElement('canvas'), g0 = sc.getContext('2d');
const lb = document.createElement('canvas'), lg = lb.getContext('2d');
let K = 1, SS = 1, B = 1, PXM = 1, cur = 0;
const FM = '"IBM Plex Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace';
const FS = '"Noto Serif SC","Songti SC","STSong","PingFang SC","Noto Sans SC","Microsoft YaHei",serif';
const FE = '"Cormorant Garamond",Georgia,serif';
const cl = x => x < 0 ? 0 : x > 1 ? 1 : x, P = (t, a, b) => cl((t - a) / (b - a)), L = (a, b, k) => a + (b - a) * k;
const E = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, EO = x => 1 - Math.pow(1 - x, 3);
const mod = (a, n) => ((a % n) + n) % n, q2 = t => Math.floor(t * 12 + 1e-6) / 12, TAU = 6.2832;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FILTER = (() => { try { const c = document.createElement('canvas'); c.width = c.height = 9; const x = c.getContext('2d'); x.filter = 'blur(2px)'; x.fillStyle = '#fff'; x.fillRect(4, 4, 1, 1); return x.getImageData(2, 4, 1, 1).data[3] > 0; } catch (e) { return false; } })();

// ---------------- camera / layers ----------------
const cam = { x: 0, y: 0, z: 0, f: 1400 }; let fz = 14;
const sOf = d => cam.f / Math.max(0.05, d - cam.z);
const sx = (X, d) => 960 + (X - cam.x) * sOf(d), sy = (Y, d) => HZ + (Y - cam.y) * sOf(d);
function setL(c, d) { const s = sOf(d); c.setTransform(B * s, 0, 0, B * s, B * (960 - cam.x * s), B * (HZ - cam.y * s)); PXM = 1 / s; return s; }
const coc = d => Math.min(44, cam.f * 0.022 * Math.abs(1 / Math.max(0.05, d - cam.z) - 1 / fz));
function layer(blur, fn) {
  if (blur < 2) { B = SS; fn(g0); g0.setTransform(SS, 0, 0, SS, 0, 0); g0.globalAlpha = 1; return; }
  lg.setTransform(1, 0, 0, 1, 0, 0); lg.clearRect(0, 0, lb.width, lb.height);
  const r = FILTER ? 1 : 1 / (1 + blur * 0.28); B = SS * r; fn(lg); lg.globalAlpha = 1;
  g0.save(); g0.setTransform(1, 0, 0, 1, 0, 0);
  if (FILTER) { g0.filter = `blur(${(blur * SS * 0.42).toFixed(2)}px)`; g0.drawImage(lb, 0, 0); }
  else g0.drawImage(lb, 0, 0, lb.width * r, lb.height * r, 0, 0, lb.width, lb.height);
  g0.restore(); B = SS; g0.setTransform(SS, 0, 0, SS, 0, 0);
}
function bk(c, x, y, r0, blur, col, a) { // circular bokeh, screen coords
  const r = Math.max(r0, blur * .85); if (x < -r || x > W + r || y < -r || y > PH + r) return;
  c.globalAlpha = a * Math.min(1, Math.max(.1, 3 * (r0 + 1.5) * (r0 + 1.5) / ((r + 1.5) * (r + 1.5)))); c.fillStyle = col;
  if (r < 2.2) { c.fillRect(x - r, y - r, 2 * r, 2 * r); return; }
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  if (r > 7) { c.globalAlpha *= .7; c.strokeStyle = col; c.lineWidth = Math.max(1, r * .07); c.stroke(); }
}
function glow(c, x, y, r, col, a) { const gr = c.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(.25, `rgba(${col},${a * .35})`); gr.addColorStop(1, `rgba(${col},0)`); c.fillStyle = gr; c.fillRect(x - r, y - r, 2 * r, 2 * r); }

// ---------------- static world data (seeded) ----------------
const FLOOR = 1.55, HERX = -0.8, HIMX = 2.0, HIMY = 1.47, LAMPX = 1.95, LAMPY = -3.08;
const CITY = (() => { const R = rng(77), b = [], w = []; let X = -170; while (X < 170) { const bw = 6 + R() * 15, bh = 10 + R() * 42 * (R() < .22 ? 1.7 : 1); b.push([X, bw, bh]);
  const cols = Math.floor(bw / 2.3), rows = Math.floor(bh / 3.1);
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) if (R() < .15) w.push([X + 1.1 + i * 2.3, 10 - j * 3.1, R() < .72 ? 0 : 1, .35 + R() * .65]);
  if (bh > 55) w.push([X + bw / 2, 12 - bh - .5, 2, 1]); X += bw + R() * 2.5; } return { b, w }; })();
const RAIN = (() => { const R = rng(9), a = []; for (let i = 0; i < 460; i++) a.push([R(), R(), R()]); return a; })();
const DROPS = (() => { const R = rng(21), a = []; for (let i = 0; i < 230; i++) { const sl = R() < .16; a.push({ u: (R() * 2 - 1) * .96, v: .04 + R() * .94, r: .0022 + R() * R() * .005, tb: R() < .72 ? -9 : R() * 5, ts: R() * 4.2, sp: sl ? .05 + R() * .1 : 0 }); } return a; })();
const SPL = (() => { const R = rng(5), a = []; for (let i = 0; i < 70; i++) a.push([i * .085 + R() * .05 - .6, (R() * 2 - 1) * .9, .1 + R() * .85]); return a; })();
const BK3 = (() => { const R = rng(31), a = []; for (let i = 0; i < 24; i++) a.push([R() * W, R() * PH * .8, 22 + R() * 55, R() < .55 ? '#cfe5e2' : R() < .6 ? '#efb56f' : '#6fb2ba', .1 + R() * .22]); return a; })();

// ---------------- train ----------------
const LC = 18, GAP = 1.5, NCAR = 5, TL = NCAR * LC + (NCAR - 1) * GAP, XG = 1.78;
const TK = [[9.9, -50, 30], [11.9, XG + LC + GAP / 2, 3], [12.8, XG + 2 * LC + 1.5 * GAP, 3], [15.4, 108.8, 32], [18.2, 205, 40]];
function front(t) {
  if (t <= TK[0][0]) return TK[0][1] + (t - TK[0][0]) * TK[0][2];
  for (let i = 0; i < TK.length - 1; i++) { const [t0, x0, v0] = TK[i], [t1, x1, v1] = TK[i + 1]; if (t <= t1) { const h = t1 - t0, s = (t - t0) / h, s2 = s * s, s3 = s2 * s; return (2 * s3 - 3 * s2 + 1) * x0 + (s3 - 2 * s2 + s) * h * v0 + (-2 * s3 + 3 * s2) * x1 + (s3 - s2) * h * v1; } }
  const l = TK[TK.length - 1]; return l[1] + (t - l[0]) * l[2];
}
const tspeed = t => (front(t + .01) - front(t - .01)) / .02, XC6 = front(15.0) - TL - 5;
const DOORS = [3.1, 13.5], WINS = [[.45, 1.45], [4.75, 1.7], [6.95, 1.7], [9.15, 1.7], [11.35, 1.7], [15.25, 1.5]];
const TSP = 56;
function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.lineTo(a + w - r, b); x.quadraticCurveTo(a + w, b, a + w, b + r); x.lineTo(a + w, b + h); x.lineTo(a, b + h); x.lineTo(a, b + r); x.quadraticCurveTo(a, b, a + r, b); x.closePath(); }
function winP(x, wx, wy, ww, wh, R) {
  const gr = x.createLinearGradient(0, wy, 0, wy + wh); gr.addColorStop(0, '#fff2cc'); gr.addColorStop(1, '#dcae6c'); x.fillStyle = gr; x.fillRect(wx, wy, ww, wh);
  x.fillStyle = 'rgba(96,74,52,.8)'; x.fillRect(wx, wy + wh * .72, ww, wh * .28);
  x.fillStyle = 'rgba(130,112,90,.55)'; x.fillRect(wx + ww * .5, wy, .03, wh);
  if (ww > 1 && R() < .35) { const p = wx + .3 + R() * (ww - .6); x.fillStyle = '#3a2e26'; x.beginPath(); x.arc(p, wy + wh * .5, .12, 0, TAU); x.fill(); x.fillRect(p - .2, wy + wh * .62, .4, wh * .4); }
  x.strokeStyle = 'rgba(18,22,25,.95)'; x.lineWidth = .05; x.strokeRect(wx, wy, ww, wh);
}
function makeCar(kind) {
  const c = document.createElement('canvas'); c.width = Math.round(LC * TSP); c.height = Math.round(4.8 * TSP);
  const x = c.getContext('2d'), R = rng(100 + kind); x.scale(TSP, TSP); x.translate(0, 2.0);
  x.fillStyle = '#0f1315'; x.fillRect(.6, 2.0, 16.8, .45);
  for (const bx of [2.6, 15.4]) { x.fillStyle = '#0a0d0f'; x.fillRect(bx - 1.3, 2.05, 2.6, .4); for (const w of [-.75, .75]) { x.beginPath(); x.arc(bx + w, 2.42, .38, 0, TAU); x.fillStyle = '#13181a'; x.fill(); x.strokeStyle = 'rgba(150,165,170,.4)'; x.lineWidth = .04; x.stroke(); } }
  const bg = x.createLinearGradient(0, -1.75, 0, 2.1); bg.addColorStop(0, '#262d31'); bg.addColorStop(.07, '#7f8b8f'); bg.addColorStop(.2, '#606b70'); bg.addColorStop(.7, '#4c575b'); bg.addColorStop(1, '#22282b');
  x.fillStyle = bg; rr(x, .05, -1.75, 17.9, 3.85, .32); x.fill();
  x.fillStyle = 'rgba(220,232,235,.35)'; x.fillRect(.3, -1.5, 17.4, .035);
  x.fillStyle = '#0d1214'; x.fillRect(.2, -.98, 17.6, 1.36);
  for (const [wx, ww] of WINS) winP(x, wx, -.88, ww, 1.12, R);
  for (const dx of DOORS) { x.fillStyle = '#58636a'; x.fillRect(dx, -1.2, 1.35, 3.25); x.strokeStyle = 'rgba(0,0,0,.55)'; x.lineWidth = .03; x.strokeRect(dx, -1.2, 1.35, 3.25); x.beginPath(); x.moveTo(dx + .675, -1.2); x.lineTo(dx + .675, 2.05); x.stroke(); winP(x, dx + .14, -.9, .42, 1.1, R); winP(x, dx + .79, -.9, .42, 1.1, R); }
  x.fillStyle = '#2e7c83'; x.fillRect(.05, .55, 17.9, .15); x.fillStyle = '#b8c4c2'; x.fillRect(.05, .74, 17.9, .025);
  if (kind === 0) {
    x.fillStyle = '#1d2427'; x.beginPath(); x.moveTo(17.1, -1.75); x.lineTo(17.95, -1.15); x.lineTo(17.95, 2.1); x.lineTo(17.1, 2.1); x.closePath(); x.fill();
    const wg = x.createLinearGradient(17.2, -1.5, 17.9, .1); wg.addColorStop(0, '#3a4c55'); wg.addColorStop(.5, '#10181c'); wg.addColorStop(1, '#22323a');
    x.fillStyle = wg; x.beginPath(); x.moveTo(17.25, -1.55); x.lineTo(17.88, -1.1); x.lineTo(17.88, .05); x.lineTo(17.25, .05); x.closePath(); x.fill();
    x.fillStyle = '#fff4d6'; x.fillRect(17.72, 1.1, .2, .3); x.fillStyle = '#ffb04a'; x.fillRect(15.9, -1.47, 1.1, .26);
  }
  if (kind === 2) { x.fillStyle = '#1d2427'; x.fillRect(.05, -1.6, .6, 3.7); x.fillStyle = '#ff3a2e'; x.fillRect(.08, 1.12, .22, .26); }
  return c;
}
let CARS = null;

// ---------------- characters ----------------
function sleeve(c, sg, col) {
  c.fillStyle = col; c.beginPath(); c.moveTo(sg * .2, -1.39); c.quadraticCurveTo(sg * .25, -1.3, sg * .252, -1.12); c.lineTo(sg * .256, -.9); c.lineTo(sg * .224, -.845); c.lineTo(sg * .193, -.87); c.lineTo(sg * .188, -1.22); c.closePath(); c.fill();
  c.fillStyle = '#caa58c'; c.beginPath(); c.ellipse(sg * .226, -.82, .024, .03, 0, 0, TAU); c.fill();
}
function domePath(c, cx, rimY, R, Hd, ry) {
  c.beginPath(); for (let i = 0; i <= 24; i++) { const a = -Math.PI / 2 + Math.PI * i / 24, x = cx + R * Math.sin(a), y = rimY - Hd * Math.pow(Math.cos(a), .7); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  for (let k = 1; k <= 4; k++) { const th = k * Math.PI / 4, tm = th - Math.PI / 8; c.quadraticCurveTo(cx + R * .96 * Math.cos(tm), rimY + ry * Math.sin(tm) - .03, cx + R * Math.cos(th), rimY + ry * Math.sin(th)); }
  c.closePath();
}
function canopy(c, cx, rimY, R, Hd, ry, t, near) { // transparent umbrella with drops
  const px = PXM;
  domePath(c, cx, rimY, R, Hd, ry);
  const fg = c.createRadialGradient(cx, rimY - Hd * .35, R * .1, cx, rimY - Hd * .35, R * 1.08);
  fg.addColorStop(0, 'rgba(190,215,220,.035)'); fg.addColorStop(.78, 'rgba(200,225,230,.08)'); fg.addColorStop(1, 'rgba(228,240,242,.24)');
  const small = R / px < 160; c.fillStyle = fg; c.fill(); if (small) { c.fillStyle = 'rgba(220,235,238,.14)'; c.fill(); } c.strokeStyle = small ? 'rgba(236,244,245,.8)' : 'rgba(228,240,242,.5)'; c.lineWidth = px * (small ? 2.2 : 1.8); c.stroke();
  c.strokeStyle = 'rgba(235,244,244,.26)'; c.lineWidth = Math.max(px * 1.2, .0035); c.beginPath();
  for (let k = 0; k < 8; k++) { const th = k * Math.PI / 4, ex = cx + R * Math.cos(th), ey = rimY + ry * Math.sin(th); c.moveTo(cx, rimY - Hd); c.quadraticCurveTo(cx + R * .9 * Math.cos(th), rimY - Hd * .72 + ry * .6 * Math.sin(th), ex, ey); }
  c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = R * .05; c.beginPath(); c.arc(cx, rimY + Hd * .2, R * .78, Math.PI * 1.18, Math.PI * 1.45); c.stroke();
  if (R / px < 90) return;
  const top = u => rimY - Hd * Math.pow(Math.max(0, 1 - u * u), .35), bot = u => rimY + ry * Math.sqrt(Math.max(0, 1 - u * u));
  for (const d of DROPS) {
    if (t < d.tb) continue; let v = d.v; const sc_ = EO(P(t, d.tb, d.tb + .07));
    if (d.sp && t > d.ts) { v += d.sp * (t - d.ts); if (v > 1) continue; }
    const u = d.u * (1 + .03 * (v - d.v)), x = cx + u * R, tp = top(u), y = tp + v * (bot(u) - tp), r = d.r * sc_, rp = r / px;
    if (d.sp && t > d.ts && rp > 3) { c.strokeStyle = 'rgba(210,230,235,.16)'; c.lineWidth = r * .8; c.beginPath(); c.moveTo(x, tp + d.v * (bot(u) - tp)); c.lineTo(x, y); c.stroke(); }
    if (rp < 1.4) { c.fillStyle = 'rgba(230,240,240,.55)'; c.fillRect(x - px, y - px, px * 2, px * 2); continue; }
    c.fillStyle = 'rgba(12,22,26,.34)'; c.beginPath(); c.arc(x, y + r * .12, r * 1.06, 0, TAU); c.fill();
    c.fillStyle = 'rgba(175,200,205,.22)'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,196,120,.55)'; c.beginPath(); c.arc(x + r * .12, y + r * .38, r * .42, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(x - r * .34, y - r * .36, r * .27, 0, TAU); c.fill();
  }
  if (near) for (const [te, u, v] of SPL) { const k = (t - te) / .14; if (k < 0 || k > 1) continue; const tp = top(u), x = cx + u * R, y = tp + v * (bot(u) - tp);
    c.strokeStyle = `rgba(235,245,245,${.7 * (1 - k)})`; c.lineWidth = px * 1.5; c.beginPath(); c.ellipse(x, y, .002 + .009 * k, .0012 + .004 * k, 0, 0, TAU); c.stroke(); }
}
function drawHerBack(c, o) {
  const px = PXM, tq = o.tq || 0, br = Math.sin(tq * 2.3) * .003, up = o.umb, tau = o.turn || 0;
  c.fillStyle = '#151318';
  c.beginPath(); c.moveTo(-.115, -.56); c.lineTo(-.095, -.05); c.lineTo(-.045, -.05); c.lineTo(-.02, -.56); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(.02, -.56); c.lineTo(.045, -.05); c.lineTo(.095, -.05); c.lineTo(.115, -.56); c.closePath(); c.fill();
  c.fillStyle = '#0c0b0e'; c.fillRect(-.105, -.055, .07, .055); c.fillRect(.035, -.055, .07, .055);
  const coat = () => { c.beginPath(); c.moveTo(-.075, -1.46 + br); c.quadraticCurveTo(-.17, -1.44 + br, -.205, -1.39 + br); c.bezierCurveTo(-.225, -1.3, -.215, -1.15, -.2, -1.02); c.lineTo(-.19, -.98);
    c.bezierCurveTo(-.22, -.8, -.26, -.62, -.278, -.5); c.quadraticCurveTo(0, -.47, .278, -.5); c.bezierCurveTo(.26, -.62, .22, -.8, .19, -.98); c.lineTo(.2, -1.02);
    c.bezierCurveTo(.215, -1.15, .225, -1.3, .205, -1.39 + br); c.quadraticCurveTo(.17, -1.44 + br, .075, -1.46 + br); c.closePath(); };
  const cg = c.createLinearGradient(-.28, 0, .28, 0); cg.addColorStop(0, '#85714f'); cg.addColorStop(.45, '#b09873'); cg.addColorStop(.82, '#c3ab81'); cg.addColorStop(1, '#9f8963');
  coat(); c.fillStyle = cg; c.fill();
  const vg = c.createLinearGradient(0, -1.45, 0, -.48); vg.addColorStop(0, 'rgba(255,240,210,.1)'); vg.addColorStop(1, 'rgba(18,14,10,.4)'); c.fillStyle = vg; c.fill();
  c.strokeStyle = 'rgba(55,42,28,.4)'; c.lineWidth = px * 1.6; c.beginPath();
  c.moveTo(-.08, -.97); c.quadraticCurveTo(-.11, -.75, -.15, -.5); c.moveTo(.07, -.97); c.quadraticCurveTo(.1, -.75, .13, -.5); c.moveTo(0, -.72); c.lineTo(0, -.49);
  c.moveTo(-.19, -1.31); c.quadraticCurveTo(0, -1.27, .19, -1.31); c.stroke();
  c.fillStyle = '#978159'; c.fillRect(-.198, -1.02, .396, .034); c.fillStyle = 'rgba(40,30,20,.4)'; c.fillRect(-.198, -.99, .396, .006);
  sleeve(c, -1, '#98825e');
  if (up) { c.fillStyle = '#a28b66'; c.beginPath(); c.moveTo(.2, -1.39 + br); c.quadraticCurveTo(.252, -1.3, .246, -1.14); c.lineTo(.205, -1.1); c.lineTo(.186, -1.28); c.closePath(); c.fill(); }
  else { sleeve(c, 1, '#a28b66');
    c.fillStyle = 'rgba(214,228,230,.26)'; c.strokeStyle = 'rgba(230,240,242,.5)'; c.lineWidth = px * 1.3; c.beginPath(); c.moveTo(.21, -.8); c.lineTo(.262, -.8); c.lineTo(.252, -.3); c.lineTo(.238, -.07); c.lineTo(.228, -.3); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#1b1d20'; c.lineWidth = .012; c.beginPath(); c.moveTo(.236, -.8); c.lineTo(.236, -.86); c.arc(.214, -.86, .022, 0, Math.PI, true); c.stroke();
    const dt = mod(tq * .9, 1); c.fillStyle = 'rgba(220,235,240,.8)'; c.beginPath(); c.arc(.238, -.06 + 4.9 * dt * dt * .3, .004, 0, TAU); c.fill(); }
  c.strokeStyle = 'rgba(50,38,26,.5)'; c.lineWidth = px * 1.6; c.beginPath(); c.moveTo(-.188, -1.34); c.quadraticCurveTo(-.2, -1.1, -.192, -.9); if (!up) { c.moveTo(.188, -1.34); c.quadraticCurveTo(.2, -1.1, .192, -.9); } c.stroke();
