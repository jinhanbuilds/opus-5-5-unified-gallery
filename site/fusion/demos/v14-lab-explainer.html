<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>html,body{margin:0;height:100%;background:#0e1113;overflow:hidden}canvas{position:absolute;display:block}</style>

<body>
<canvas id="c"></canvas>
<script>
/* LAB EXPLAINER — why light gets trapped in glass. 24 s, 1920×1080, one draw(t).
   One physics model drives rays AND every number on screen:
     Snell  n·sin θ1 = 1·sin θ2   (glass/water/diamond → air)     θc = arcsin(1/n)
     Fresnel (unpolarised) R = (Rs+Rp)/2 → beam brightness + R/T readouts; R = 1 when n·sin θ1 > 1.
   0.0– 2.5  bench wide, glass n=1.50, θ1 = 20°, title question
   2.5– 7.6  slider drags θ1 20° → 41.7°: refracted ray swings toward the surface (skims at ~86°)
   7.6– 8.4  hold just under θc (41.8°)
   8.4–12.4  θ1 → 55°: TIR; camera pushes in to the boundary (macro), live formula shows n·sin θ1 > 1
  12.4–16.4  click WATER (1.33): 55° → 45° escapes at 70.1°, then → 52° crosses θc 48.8° → trapped
  16.4–20.4  click DIAMOND (2.42): → 15° escapes, → 30° crosses θc 24.4° → trapped
  20.4–23.2  comparison cut: θc(n) curve + three escape cones, formula θc = arcsin(1/n)
  23.2–24.0  cross-fade back to the opening bench state (glass, 20°) → seamless loop
*/
(() => {
const W = 1920, H = 1080, DUR = 24, D2R = Math.PI / 180;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FH = '"Barlow Condensed","Arial Narrow",Arial,sans-serif', FB = '"Barlow","Helvetica Neue",Arial,sans-serif', FM = '"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace';
const C = { bench: '#14171a', ink: '#e9eef0', dim: '#7f8a90', faint: 'rgba(190,205,212,.28)', red: '255,64,50', amber: '#ffb547', panel: 'rgba(9,12,14,.9)', line: 'rgba(130,146,152,.35)' };
const cl = x => x < 0 ? 0 : x > 1 ? 1 : x, P = (t, a, b) => cl((t - a) / (b - a)), L = (a, b, k) => a + (b - a) * k;
const E = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, EO = x => 1 - Math.pow(1 - x, 3);
const mod = (a, n) => ((a % n) + n) % n;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------- the model ----------------
const MATS = [{ k: 'GLASS', n: 1.50, col: '160,222,236' }, { k: 'WATER', n: 1.33, col: '80,160,225' }, { k: 'DIAMOND', n: 2.42, col: '236,244,255' }];
const crit = n => Math.asin(1 / n) / D2R;                       // degrees
const snell = (n, th) => { const s = n * Math.sin(th * D2R); return s > 1 ? null : Math.asin(s) / D2R; };
function fresnel(n, th) { const t2 = snell(n, th); if (t2 === null) return 1; const ci = Math.cos(th * D2R), ct = Math.cos(t2 * D2R);
  const rs = ((n * ci - ct) / (n * ci + ct)) ** 2, rp = ((n * ct - ci) / (n * ct + ci)) ** 2; return (rs + rp) / 2; }
const f1 = x => x.toFixed(1), f2 = x => x.toFixed(2);
const TH = [[0, 20], [2.5, 20], [7.6, 41.7], [8.4, 41.7], [10.0, 55], [12.9, 55], [13.9, 45], [14.6, 45], [15.8, 52], [16.9, 52], [17.8, 15], [18.2, 15], [19.4, 30], [20.4, 30], [20.401, 20], [24, 20]];
function theta(t) { for (let i = 0; i < TH.length - 1; i++) { const [a, x] = TH[i], [b, y] = TH[i + 1]; if (t <= b) return L(x, y, E(P(t, a, b))); } return 20; }
const matAt = t => t < 12.5 ? 0 : t < 16.5 ? 1 : t < 20.4 ? 2 : 0;
function matMix(t) { const m = matAt(t), sw = t >= 16.5 && t < 20.4 ? 16.5 : t >= 12.5 && t < 16.5 ? 12.5 : -9; return { m, prev: m === 1 ? 0 : m === 2 ? 1 : 0, k: sw > 0 ? E(P(t, sw, sw + .35)) : 1 }; }

// ---------------- layout ----------------
const O = { x: 860, y: 470 }, RB = 262, RP = 322, RL = 384;
const PX = 1440, PY = 500, PW = 400, PHh = 480;
const BTN = [[1460, 1572], [1584, 1696], [1708, 1820]].map(([a, b]) => ({ x: a, w: b - a, cx: (a + b) / 2, cy: PY + 97 }));
const TRK = { x0: 1460, x1: 1820, y: PY + 212 };
const knob = t => ({ x: TRK.x0 + theta(t) / 90 * (TRK.x1 - TRK.x0), y: TRK.y });
const REST = { x: 1862, y: 1004 };
function camZ(t) { return 1 + 1.25 * E(P(t, 8.3, 9.2)) * (1 - E(P(t, 11.5, 12.35))); }

// ---------------- bench (pre-rendered once) ----------------
let BENCH = null;
function makeBench() {
  const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; const x = c.getContext('2d'), R = rng(12);
  x.fillStyle = C.bench; x.fillRect(0, 0, 1920, 1080);
  const g = x.createRadialGradient(900, 480, 60, 900, 520, 1100); g.addColorStop(0, 'rgba(120,140,150,.13)'); g.addColorStop(1, 'rgba(0,0,0,.35)'); x.fillStyle = g; x.fillRect(0, 0, 1920, 1080);
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${R() < .5 ? '255,255,255' : '0,0,0'},${.02 + R() * .04})`; x.fillRect(R() * 1920, R() * 1080, 1, 1); }
  x.strokeStyle = 'rgba(255,255,255,.025)'; x.lineWidth = 1; for (let i = 0; i < 70; i++) { const px = R() * 1920, py = R() * 1080, a = R() * 3.14, l = 20 + R() * 90; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  for (let gy = 36; gy < 1080; gy += 50) for (let gx = 28; gx < 1920; gx += 50) {
    x.fillStyle = '#07090a'; x.beginPath(); x.arc(gx, gy, 5.5, 0, 6.283); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.07)'; x.lineWidth = 1.2; x.beginPath(); x.arc(gx, gy, 6.2, .2, 1.9); x.stroke(); }
  x.font = `400 13px ${FM}`; x.fillStyle = 'rgba(200,210,215,.28)'; x.fillText('OPTICAL BENCH  ·  M6 / 50 mm  ·  CLASS 2 LASER  650 nm', 60, 1050);
  return c;
}

// ---------------- drawing helpers ----------------
function txt(s, x, y, font, col, a = 1, align = 'left', base = 'alphabetic', ls = 0) { if (a <= .003) return; ctx.globalAlpha = a; ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = ls + 'px'; ctx.fillText(s, x, y); ctx.letterSpacing = '0px'; ctx.globalAlpha = 1; }
function fitFont(s, weight, size, fam, maxW) { let z = size; ctx.font = `${weight} ${z}px ${fam}`; const w = ctx.measureText(s).width; if (w > maxW) z = Math.max(size * .6, size * maxW / w); return `${weight} ${z.toFixed(1)}px ${fam}`; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function beam(x0, y0, x1, y1, I, z, fade) { // additive laser segment, intensity I 0..1
  if (I <= .001) return; const a = .12 + .88 * Math.pow(I, .7);
  const seg = (lw, col, al) => { ctx.lineWidth = lw; if (fade) { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, `rgba(${col},${al})`); g.addColorStop(1, `rgba(${col},0)`); ctx.strokeStyle = g; } else ctx.strokeStyle = `rgba(${col},${al})`; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
  ctx.lineCap = 'round'; seg(22 * z, C.red, .07 * a); seg(8 * z, C.red, .28 * a); seg(2.6 * z, '255,190,180', .95 * a); ctx.lineCap = 'butt';
}
function blockPath(R) { ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.arc(0, 0, R, 0, Math.PI, false); ctx.closePath(); }
function drawBlock(mi, a, t, z) {
  if (a <= .003) return; const R = RB, m = MATS[mi]; ctx.globalAlpha = a;
  ctx.save(); ctx.translate(16, 20); blockPath(R); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill(); ctx.restore();
  blockPath(R);
  if (mi === 0) { const g = ctx.createLinearGradient(-R, 0, R, R); g.addColorStop(0, 'rgba(170,225,238,.2)'); g.addColorStop(.6, 'rgba(120,190,210,.1)'); g.addColorStop(1, 'rgba(170,225,238,.22)'); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(205,240,248,.75)'; ctx.lineWidth = 2 / z; ctx.stroke();
    ctx.strokeStyle = 'rgba(205,240,248,.18)'; ctx.lineWidth = 7 / z; ctx.beginPath(); ctx.arc(0, 0, R - 9, .15, Math.PI - .15); ctx.stroke(); }
  else if (mi === 1) { ctx.fillStyle = 'rgba(70,150,220,.26)'; ctx.fill(); ctx.strokeStyle = 'rgba(210,228,236,.4)'; ctx.lineWidth = 9 / z; ctx.stroke(); ctx.strokeStyle = 'rgba(230,242,248,.7)'; ctx.lineWidth = 1.5 / z; ctx.stroke();
    const R2 = rng(4); ctx.strokeStyle = 'rgba(210,235,250,.45)'; ctx.lineWidth = 1.2 / z; for (let i = 0; i < 14; i++) { const an = R2() * Math.PI, rr_ = R2() * (R - 30), bx = Math.cos(an) * rr_, by = Math.sin(an) * rr_ * .9 + 10 - mod(t * 18 * (1 + R2()), 40); ctx.beginPath(); ctx.arc(bx, Math.max(8, by), 2 + R2() * 4, 0, 6.28); ctx.stroke(); }
    ctx.fillStyle = 'rgba(160,210,240,.12)'; ctx.fillRect(-R, 0, 2 * R, 6); }
  else { ctx.fillStyle = 'rgba(230,240,255,.13)'; ctx.fill(); ctx.strokeStyle = 'rgba(245,250,255,.85)'; ctx.lineWidth = 2 / z; ctx.stroke();
    ctx.save(); blockPath(R); ctx.clip(); ctx.strokeStyle = 'rgba(235,245,255,.14)'; ctx.lineWidth = 1.2 / z; ctx.beginPath(); for (let i = 0; i <= 8; i++) { const an = i / 8 * Math.PI; ctx.moveTo(Math.cos(an) * R, Math.sin(an) * R); ctx.lineTo((i - 4) * R / 5, 0); ctx.moveTo(Math.cos(an) * R, Math.sin(an) * R); ctx.lineTo(Math.cos(an + .45) * R * .55, Math.sin(an + .45) * R * .55); } ctx.stroke(); ctx.restore();
    const R2 = rng(9); for (let i = 0; i < 9; i++) { const an = .15 + R2() * 2.84, rr_ = R * (.35 + R2() * .6), x = Math.cos(an) * rr_, y = Math.sin(an) * rr_, tw = Math.max(0, Math.sin(t * 5.3 + i * 2.1)), s = (4 + 9 * tw) / z;
      ctx.fillStyle = `rgba(255,255,255,${.8 * tw})`; ctx.beginPath(); ctx.moveTo(x, y - s * 2); ctx.lineTo(x + s * .3, y); ctx.lineTo(x, y + s * 2); ctx.lineTo(x - s * .3, y); ctx.closePath(); ctx.moveTo(x - s * 2, y); ctx.lineTo(x, y + s * .3); ctx.lineTo(x + s * 2, y); ctx.lineTo(x, y - s * .3); ctx.fill(); } }
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.2 / z; ctx.beginPath(); ctx.moveTo(-R + 6, 2); ctx.lineTo(R - 6, 2); ctx.stroke();
  ctx.globalAlpha = 1;
}
function protractor(z, n, a) {
  ctx.globalAlpha = a; ctx.strokeStyle = C.faint; ctx.lineWidth = 1.2 / z;
  ctx.beginPath(); ctx.arc(0, 0, RP, 0, Math.PI); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, RP, -Math.PI / 2, 0); ctx.stroke();
  ctx.beginPath(); for (let d = 0; d <= 90; d += 2) { const L_ = d % 10 === 0 ? 16 : 7; for (const [sx, sy] of [[-1, 1], [1, 1], [1, -1]]) { const an = d * D2R, ux = Math.sin(an) * sx, uy = Math.cos(an) * sy; ctx.moveTo(ux * RP, uy * RP); ctx.lineTo(ux * (RP - L_), uy * (RP - L_)); } } ctx.stroke();
  ctx.font = `400 ${13 / z}px ${FM}`; ctx.fillStyle = 'rgba(190,205,212,.45)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let d = 10; d <= 80; d += 10) for (const [sx, sy] of [[-1, 1], [1, 1], [1, -1]]) { const an = d * D2R; ctx.fillText(String(d), Math.sin(an) * sx * (RP + 18), Math.cos(an) * sy * (RP + 18)); }
  const c_ = crit(n) * D2R, ux = -Math.sin(c_), uy = Math.cos(c_); ctx.strokeStyle = C.amber; ctx.lineWidth = 3 / z; ctx.beginPath(); ctx.moveTo(ux * (RP - 22), uy * (RP - 22)); ctx.lineTo(ux * (RP + 6), uy * (RP + 6)); ctx.stroke();
  ctx.font = `600 ${14 / z}px ${FM}`; ctx.fillStyle = C.amber; ctx.fillText('θc', ux * (RP + 40), uy * (RP + 40));
  ctx.setLineDash([8 / z, 7 / z]); ctx.strokeStyle = 'rgba(210,222,228,.35)'; ctx.lineWidth = 1.3 / z; ctx.beginPath(); ctx.moveTo(0, -RP - 10); ctx.lineTo(0, RP + 10); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}
function laser(th, z) {
  const an = th * D2R, ux = -Math.sin(an), uy = Math.cos(an), ax = ux * RL, ay = uy * RL;
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 16 / z; ctx.beginPath(); ctx.arc(0, 0, RL + 64, Math.PI * .5, Math.PI * .98); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1 / z; ctx.beginPath(); ctx.arc(0, 0, RL + 72, Math.PI * .5, Math.PI * .98); ctx.stroke();
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(Math.atan2(uy, ux));
  ctx.fillStyle = 'rgba(0,0,0,.4)'; rrect(10, -14, 128, 40, 10); ctx.fill();
  const g = ctx.createLinearGradient(0, -18, 0, 18); g.addColorStop(0, '#5a6166'); g.addColorStop(.45, '#2a2f33'); g.addColorStop(1, '#16191b'); ctx.fillStyle = g; rrect(0, -18, 128, 36, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#0c0e0f'; ctx.fillRect(-6, -11, 10, 22); ctx.fillStyle = '#b89a54'; ctx.fillRect(20, -18, 3, 36); ctx.fillRect(100, -18, 3, 36);
  ctx.fillStyle = `rgba(${C.red},1)`; ctx.beginPath(); ctx.arc(112, 0, 3.2, 0, 6.28); ctx.fill();
  ctx.save(); ctx.rotate(Math.PI); ctx.font = `600 11px ${FM}`; ctx.fillStyle = 'rgba(230,236,238,.75)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('650 nm', -62, 0); ctx.restore();
  ctx.restore();
  return { ax: ax - ux * 4, ay: ay - uy * 4, ux, uy };
}
function arcLabel(r, a0, a1, label, z, col) { // angles in canvas radians
  ctx.strokeStyle = col; ctx.lineWidth = 2 / z; ctx.beginPath(); ctx.arc(0, 0, r, Math.min(a0, a1), Math.max(a0, a1)); ctx.stroke();
  const am = (a0 + a1) / 2; ctx.font = `600 ${17 / z}px ${FM}`; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, Math.cos(am) * (r + 30 / z), Math.sin(am) * (r + 30 / z));
}

// ---------------- scene: bench ----------------
function bench(t, a) {
  const z = camZ(t), th = theta(t), mm = matMix(t), n = MATS[mm.m].n, t2 = snell(n, th), R = fresnel(n, th);
  ctx.save(); ctx.globalAlpha = a;
  ctx.setTransform(K * z, 0, 0, K * z, K * (O.x - O.x * z), K * (O.y - O.y * z)); ctx.drawImage(BENCH, 0, 0);
  ctx.restore(); ctx.save();
  ctx.setTransform(K * z, 0, 0, K * z, K * O.x, K * O.y);
  protractor(z, n, a);
  ctx.globalAlpha = a;
  if (mm.k < 1) drawBlock(mm.prev, a * (1 - mm.k), t, z); drawBlock(mm.m, a * mm.k, t, z);
  const L_ = laser(th, z);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  const an = th * D2R, ex = -Math.sin(an) * RB, ey = Math.cos(an) * RB;
  beam(L_.ax, L_.ay, ex, ey, 1, 1); beam(ex, ey, 0, 0, 1, 1);                      // in → centre of flat face (radial: no bend at the curve)
  const rx = Math.sin(an) * RB, ry = Math.cos(an) * RB; beam(0, 0, rx, ry, R, 1); beam(rx, ry, rx + Math.sin(an) * 420, ry + Math.cos(an) * 420, R, 1, 1); // reflected
  if (t2 !== null) { const b2 = t2 * D2R; beam(0, 0, Math.sin(b2) * 1150, -Math.cos(b2) * 1150, 1 - R, 1, 1); }   // refracted into air
  const sp = ctx.createRadialGradient(0, 0, 0, 0, 0, 46); sp.addColorStop(0, `rgba(255,220,210,${.9})`); sp.addColorStop(.3, `rgba(${C.red},.35)`); sp.addColorStop(1, `rgba(${C.red},0)`); ctx.fillStyle = sp; ctx.fillRect(-46, -46, 92, 92);
  ctx.globalCompositeOperation = 'source-over';
  const lk = a * (.55 + .45 * P(z, 1, 1.6));
  ctx.globalAlpha = lk; arcLabel(84, Math.PI / 2, Math.PI / 2 + an, 'θ₁', z, '#ffd2c8');
  if (t2 !== null) arcLabel(104, -Math.PI / 2, -Math.PI / 2 + t2 * D2R, 'θ₂', z, '#ffd2c8');
  if (t2 === null) { ctx.globalAlpha = lk * .9; arcLabel(66, Math.PI / 2, Math.PI / 2 - an, 'θ₁', z, 'rgba(255,210,200,.7)'); }
  ctx.globalAlpha = a * .75; ctx.font = `500 ${15 / z}px ${FM}`; ctx.fillStyle = 'rgba(210,222,228,.7)'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(`${MATS[mm.m].k.toLowerCase()} · n = ${f2(n)}`, -RB + 30, RB * .45); ctx.fillText('air · n = 1.00', RB * .55, -26);
  ctx.restore(); ctx.globalAlpha = 1;
  return { th, n, t2, R, m: mm.m };
}
// ---------------- console ----------------
function consolePanel(t, s, a) {
  if (a <= .003) return; ctx.save(); ctx.setTransform(K, 0, 0, K, 0, 0); ctx.globalAlpha = a;
  rrect(PX, PY, PW, PHh, 14); ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore(); ctx.save(); ctx.setTransform(K, 0, 0, K, 0, 0);
  txt('CONSOLE', PX + 20, PY + 36, `600 15px ${FM}`, C.dim, a, 'left', 'alphabetic', 2);
  txt('● LASER ON', PX + PW - 20, PY + 36, `600 15px ${FM}`, `rgb(${C.red})`, a, 'right', 'alphabetic', 1);
  const cks = [12.45, 16.45];
  BTN.forEach((b, i) => { const sel = s.m === i, press = cks.some((c, j) => j + 1 === i && t > c - .02 && t < c + .12);
    ctx.globalAlpha = a; rrect(b.x, PY + 70, b.w, 54, 9); ctx.fillStyle = sel ? '#e7ecee' : press ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.03)'; ctx.fill(); ctx.strokeStyle = sel ? '#e7ecee' : C.line; ctx.lineWidth = 1; ctx.stroke();
    txt(MATS[i].k, b.cx, PY + 95, `600 21px ${FH}`, sel ? '#0e1215' : C.ink, a, 'center', 'alphabetic', 1.5);
    txt('n ' + f2(MATS[i].n), b.cx, PY + 115, `400 14px ${FM}`, sel ? '#3b4448' : C.dim, a, 'center'); });
  txt('INCIDENCE  θ₁', PX + 20, PY + 175, `600 15px ${FM}`, C.dim, a, 'left', 'alphabetic', 1);
  const tc = crit(s.n), xc = TRK.x0 + tc / 90 * (TRK.x1 - TRK.x0);
  ctx.globalAlpha = a; ctx.fillStyle = 'rgba(255,181,71,.16)'; ctx.fillRect(xc, TRK.y - 5, TRK.x1 - xc, 10);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(TRK.x0, TRK.y - 2, xc - TRK.x0, 4);
  ctx.fillStyle = 'rgba(255,255,255,.3)'; for (let d = 0; d <= 90; d += 10) { const x = TRK.x0 + d / 90 * 360; ctx.fillRect(x - .5, TRK.y + 10, 1, d % 30 ? 5 : 9); }
  ctx.fillStyle = C.amber; ctx.fillRect(xc - 1, TRK.y - 13, 2, 26); txt(`θc ${f1(tc)}°`, xc, TRK.y - 20, `600 14px ${FM}`, C.amber, a, 'center');
  txt('0°', TRK.x0, TRK.y + 34, `400 13px ${FM}`, C.dim, a, 'center'); txt('90°', TRK.x1, TRK.y + 34, `400 13px ${FM}`, C.dim, a, 'center');
  const k = knob(t); ctx.globalAlpha = a; ctx.fillStyle = '#e7ecee'; ctx.beginPath(); ctx.arc(k.x, k.y, 11, 0, 6.28); ctx.fill(); ctx.fillStyle = `rgb(${C.red})`; ctx.beginPath(); ctx.arc(k.x, k.y, 4, 0, 6.28); ctx.fill();
